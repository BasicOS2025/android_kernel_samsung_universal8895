name: Validate Exynos 8895 kernel with and without KernelSU Next
on:
  workflow_dispatch:
  push:
    branches: [lineage-24.0]
    paths: ['KernelSU/**', 'fs/**', 'kernel/**', 'security/**', 'arch/arm64/configs/**', '.github/workflows/kernel-su.yml']
permissions:
  contents: read
concurrency:
  group: kernel-next-validation
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison flex gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu libssl-dev libelf-dev make
      - name: Validate all device configurations
        run: |
          set -euo pipefail
          for device in dreamlte dream2lte greatlte; do
            make O="$RUNNER_TEMP/config-$device" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- "exynos8895-${device}_defconfig"
            grep -qx CONFIG_KSU=y "$RUNNER_TEMP/config-$device/.config"
            grep -qx CONFIG_KSU_MANUAL_HOOK=y "$RUNNER_TEMP/config-$device/.config"
            if grep -Eq '^CONFIG_KSU_(KPROBES_HOOK|SYSCALL_TABLE_HOOK)=y$' "$RUNNER_TEMP/config-$device/.config"; then exit 1; fi
          done
      - name: Compile baseline and KernelSU Next kernel
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kernel-logs"
          for mode in plain next; do
            output="$RUNNER_TEMP/kernel-$mode"
            make O="$output" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- exynos8895-dreamlte_defconfig
            if [[ "$mode" == plain ]]; then scripts/config --file "$output/.config" --disable KSU; fi
            make O="$output" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
            make -j4 O="$output" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- HOSTCFLAGS='-O2 -fcommon' Image 2>&1 | tee "$RUNNER_TEMP/kernel-logs/$mode.log"
            test -s "$output/arch/arm64/boot/Image"
            if [[ "$mode" == next ]]; then
              aarch64-linux-gnu-nm "$output/vmlinux" | grep -w kernelsu_init > "$RUNNER_TEMP/kernel-logs/linked-kernelsu-symbol.txt"
            fi
          done
      - name: Record compatibility changes
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/kernel-logs"
          git diff --binary > "$RUNNER_TEMP/kernel-logs/compatibility.patch"
          for config in "$RUNNER_TEMP"/config-*/.config "$RUNNER_TEMP"/kernel-*/.config; do
            if [[ -f "$config" ]]; then cp "$config" "$RUNNER_TEMP/kernel-logs/$(basename "$(dirname "$config")").config"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-next-diagnostics
          path: ${{ runner.temp }}/kernel-logs/
          retention-days: 14
